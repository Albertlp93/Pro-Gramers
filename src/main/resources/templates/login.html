<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión — Biblioteca Pro-Gramers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<main class="container py-5">
    <div class="card mx-auto p-4" style="max-width: 28rem">
        <p class="text-secondary mb-1">Biblioteca Pro-Gramers</p>
        <h1 class="h3 mb-4">Iniciar sesión</h1>

        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            No se ha podido iniciar sesión. Comprueba tus credenciales.
        </div>

        <div th:if="${param.logout}" class="alert alert-success" role="status">
            Has cerrado sesión.
        </div>

        <div th:if="${param.registrado}" class="alert alert-success" role="status">
            Cuenta creada. Ya puedes iniciar sesión.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input id="email" name="email" type="email"
                       class="form-control" autocomplete="username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input id="password" name="password" type="password"
                       class="form-control" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Entrar
            </button>
        </form>

        <p class="mt-3 mb-0">
            ¿Todavía no tienes cuenta?
            <a th:href="@{/registro}">Regístrate</a>
        </p>  
    </div>
</main>
</body>
</html>
