<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

  <!--  MENÚ COMÚN -->
  <nav th:fragment="menu(activo)" class="navbar navbar-expand-lg navbar-dark navbar-biblio">
    <div class="container">
      <a class="navbar-brand fw-semibold" th:href="@{/}">
        <i class="bi bi-book-half me-2"></i><span th:text="#{menu.marca}">Biblioteca Pro-Gramers</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
              aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar menú" th:attr="aria-label=#{menu.mostrar}">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" th:href="@{/}" th:classappend="${activo == 'inicio'} ? 'active'"><i class="bi bi-house-door me-1"></i><span th:text="#{menu.inicio}">Inicio</span></a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/libros}" th:classappend="${activo == 'libros'} ? 'active'"><i class="bi bi-book me-1"></i><span th:text="#{menu.libros}">Libros</span></a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/autores}" th:classappend="${activo == 'autores'} ? 'active'"><i class="bi bi-person-badge me-1"></i><span th:text="#{menu.autores}">Autores</span></a></li>
          <li class="nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')"><a class="nav-link" th:href="@{/usuarios}" th:classappend="${activo == 'usuarios'} ? 'active'"><i class="bi bi-people me-1"></i><span th:text="#{menu.usuarios}">Usuarios</span></a></li>
          <li class="nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')"><a class="nav-link" th:href="@{/prestamos}" th:classappend="${activo == 'prestamos'} ? 'active'"><i class="bi bi-arrow-left-right me-1"></i><span th:text="#{menu.prestamos}">Préstamos</span></a></li>
          <li class="nav-item" sec:authorize="hasAuthority('ROLE_USER')"><a class="nav-link" th:href="@{/user/prestamos}" th:classappend="${activo == 'misprestamos'} ? 'active'"><i class="bi bi-journal-bookmark me-1"></i><span th:text="#{menu.misPrestamos}">Mis préstamos</span></a></li>
        </ul>
        <div class="d-flex align-items-center gap-2 ms-lg-3" sec:authorize="isAuthenticated()">
          <span class="navbar-text small">
            <i class="bi bi-person-circle me-1"></i><span sec:authentication="name">usuario@example.com</span>
          </span>
          <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-sm btn-outline-light">
              <i class="bi bi-box-arrow-right me-1"></i><span th:text="#{menu.cerrarSesion}">Cerrar sesión</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </nav>

</body>
</html>
