<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros — Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/menu :: menu('libros')}"></div>

<main class="container py-4">

    <div th:if="${mensaje}"
         class="alert alert-success"
         role="status"
         th:text="${mensaje}">
    </div>

    <div th:if="${error}"
        class="alert alert-danger"
        role="alert"
        th:text="${error}">
    </div>

    <div class="encabezado d-flex justify-content-between align-items-center">
        <div>
            <h1>Libros</h1>
            <p class="text-secondary">Catálogo de la biblioteca</p>
        </div>

        <a th:href="@{/libros/nuevo}" class="btn btn-primary"
           th:text="#{libro.boton.nuevo}">
            Nuevo libro
        </a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th scope="col">Título</th>
                    <th scope="col">ISBN</th>
                    <th scope="col">Autores</th>
                    <th scope="col">Año</th>
                    <th scope="col">Editorial</th>
                    <th scope="col">Ejemplares disponibles</th>
                    <th scope="col">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="libro : ${libros}">
                    <td class="fw-semibold"
                        th:text="${libro.titulo}">
                    </td>

                    <td th:text="${libro.isbn}"></td>

                    <td>
                        <div th:each="autor : ${libro.autores}"
                             th:text="${autor.nombre + ' ' + autor.apellidos}">
                        </div>

                        <span th:if="${#sets.isEmpty(libro.autores)}"
                              class="text-secondary"
                              th:text="#{libro.sinAutores}">
                            Sin autores asignados
                        </span>
                    </td>

                    <td th:text="${libro.anioPublicacion}"></td>

                    <td th:text="${libro.editorial}"></td>

                    <td th:text="${libro.ejemplaresDisponibles}"></td>

                    
                    
                    
                    <td>
                        <div class="d-flex gap-2">
                            <a th:href="@{/libros/{id}/editar(id=${libro.id})}"
                            class="btn btn-sm btn-outline-primary"
                            th:text="#{boton.editar}">
                                Editar
                            </a>

                            <button type="button"
                                    class="btn btn-sm btn-outline-danger"
                                    data-bs-toggle="modal"
                                    data-bs-target="#modalEliminar"
                                    th:data-url="@{/libros/{id}/eliminar(id=${libro.id})}"
                                    th:data-titulo="${libro.titulo}"
                                    th:text="#{boton.eliminar}">
                                Eliminar
                            </button>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(libros)}">
                    <td colspan="7"
                        class="text-center text-secondary py-4"
                        th:text="#{libro.listado.vacio}">
                        No hay libros registrados.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer text-secondary">
            Total de libros:
            <span th:text="${#lists.size(libros)}">0</span>
        </div>
    </div>

    <!-- Confirmación de borrado: un único modal para todos los libros -->
    <div class="modal fade" id="modalEliminar" tabindex="-1"
         aria-labelledby="modalEliminarTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="modalEliminarTitulo">
                        <i class="bi bi-exclamation-triangle text-danger"></i>
                        <span th:text="#{libro.eliminar.titulo}">Eliminar libro</span>
                    </h2>
                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal" aria-label="Cerrar" th:attr="aria-label=#{boton.cerrar}"></button>
                </div>

                <div class="modal-body">
                    <p class="fw-semibold mb-2" id="modalEliminarLibro"></p>
                    <p class="mb-0" th:text="#{libro.eliminar.validar}">
                        ¿Seguro que quieres eliminar este libro?
                    </p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary"
                            data-bs-dismiss="modal"
                            th:text="#{boton.cancelar}">
                        Cancelar
                    </button>

                    <form id="formEliminar" method="post" action="#">
                        <button type="submit" class="btn btn-danger"
                                th:text="#{boton.eliminar}">
                            Eliminar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Al abrir el modal se copian la ruta de borrado y el título del libro pulsado
    document.getElementById('modalEliminar')
        .addEventListener('show.bs.modal', function (evento) {
            const boton = evento.relatedTarget;
            document.getElementById('formEliminar').action = boton.dataset.url;
            document.getElementById('modalEliminarLibro').textContent = boton.dataset.titulo;
        });
</script>
</body>
</html>
