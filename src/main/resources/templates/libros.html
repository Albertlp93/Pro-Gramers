<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros — Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/menu :: menu('libros')}"></div>

<main class="container py-4">

    <div th:if="${mensaje}"
         class="alert alert-success"
         role="status"
         th:text="${mensaje}">
    </div>

    <div th:if="${error}"
        class="alert alert-danger"
        role="alert"
        th:text="${error}">
    </div>

    <div class="encabezado d-flex justify-content-between align-items-center">
        <div>
            <h1>Libros</h1>
            <p class="text-secondary">Catálogo de la biblioteca</p>
        </div>

        <a th:href="@{/libros/nuevo}" class="btn btn-primary">
            Nuevo libro
        </a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th scope="col">Título</th>
                    <th scope="col">ISBN</th>
                    <th scope="col">Autores</th>
                    <th scope="col">Año</th>
                    <th scope="col">Editorial</th>
                    <th scope="col">Ejemplares disponibles</th>
                    <th scope="col">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="libro : ${libros}">
                    <td class="fw-semibold"
                        th:text="${libro.titulo}">
                    </td>

                    <td th:text="${libro.isbn}"></td>

                    <td>
                        <div th:each="autor : ${libro.autores}"
                             th:text="${autor.nombre + ' ' + autor.apellidos}">
                        </div>

                        <span th:if="${#sets.isEmpty(libro.autores)}"
                              class="text-secondary">
                            Sin autores asignados
                        </span>
                    </td>

                    <td th:text="${libro.anioPublicacion}"></td>

                    <td th:text="${libro.editorial}"></td>

                    <td th:text="${libro.ejemplaresDisponibles}"></td>

                    
                    
                    
                    <td>
                        <div class="d-flex gap-2">
                            <a th:href="@{/libros/{id}/editar(id=${libro.id})}"
                            class="btn btn-sm btn-outline-primary">
                                Editar
                            </a>

                            <form th:action="@{/libros/{id}/eliminar(id=${libro.id})}"
                                method="post"
                                onsubmit="return confirm('¿Quieres eliminar este libro? Esta acción no se puede deshacer.');">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">
                                    Eliminar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(libros)}">
                    <td colspan="7"
                        class="text-center text-secondary py-4">
                        No hay libros registrados.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer text-secondary">
            Total de libros:
            <span th:text="${#lists.size(libros)}">0</span>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
