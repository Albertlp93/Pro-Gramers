<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta — Biblioteca Pro-Gramers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<main class="container py-5">
    <div class="card mx-auto p-4" style="max-width: 32rem">
        <h1 class="h3 mb-4">Crear cuenta de socio</h1>

        <form th:action="@{/registro}" th:object="${registro}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}"
                 class="alert alert-danger" role="alert">
                <div th:each="error : ${#fields.globalErrors()}"
                     th:text="${error}"></div>
            </div>

            <div class="mb-3">
                <label for="dni" class="form-label">DNI</label>
                <input id="dni" th:field="*{dni}" class="form-control"
                       maxlength="9" required>
                <div class="text-danger small" th:errors="*{dni}"></div>
            </div>

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input id="nombre" th:field="*{nombre}" class="form-control"
                       maxlength="100" autocomplete="given-name" required>
                <div class="text-danger small" th:errors="*{nombre}"></div>
            </div>

            <div class="mb-3">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input id="apellidos" th:field="*{apellidos}" class="form-control"
                       maxlength="150" autocomplete="family-name" required>
                <div class="text-danger small" th:errors="*{apellidos}"></div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input id="email" type="email" th:field="*{email}" class="form-control"
                       maxlength="150" autocomplete="email" required>
                <div class="text-danger small" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono (opcional)</label>
                <input id="telefono" type="tel" th:field="*{telefono}" class="form-control"
                       maxlength="20" autocomplete="tel">
                <div class="text-danger small" th:errors="*{telefono}"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input id="password" name="password" type="password"
                       class="form-control" autocomplete="new-password"
                       minlength="12" maxlength="72" required>
                <div class="form-text">Usa al menos 12 caracteres.</div>
                <div class="text-danger small" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-primary">Crear cuenta</button>
            <a th:href="@{/login}" class="btn btn-outline-secondary">Volver al login</a>
        </form>
    </div>
</main>
</body>
</html>
