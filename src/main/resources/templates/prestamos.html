<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préstamos — Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/menu :: menu('prestamos')}"></div>

<main class="container py-4">
    <div class="encabezado">
        <h1>Préstamos</h1>
        <p class="text-secondary">Libros prestados y su estado</p>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th scope="col">Libro</th>
                    <th scope="col">Usuario</th>
                    <th scope="col">Fecha de préstamo</th>
                    <th scope="col">Devolución prevista</th>
                    <th scope="col">Devolución real</th>
                    <th scope="col">Estado</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="prestamo : ${prestamos}">
                    <td class="fw-semibold"
                        th:text="${prestamo.libro.titulo}">
                    </td>

                    <td th:text="${prestamo.usuario.nombre
                        + ' ' + prestamo.usuario.apellidos}">
                    </td>

                    <td th:text="${#temporals.format(
                        prestamo.fechaPrestamo, 'dd/MM/yyyy')}">
                    </td>

                    <td th:text="${#temporals.format(
                        prestamo.fechaDevolucionPrevista, 'dd/MM/yyyy')}">
                    </td>

                    <td th:text="${prestamo.fechaDevolucion != null
                        ? #temporals.format(
                            prestamo.fechaDevolucion, 'dd/MM/yyyy')
                        : '—'}">
                    </td>

                    <td>
                        <span class="badge"
                              th:classappend="${prestamo.estadoVisual == 'Devuelto'
                                  ? 'bg-success'
                                  : (prestamo.estadoVisual == 'Retrasado'
                                      ? 'bg-danger'
                                      : 'bg-warning text-dark')}"
                              th:text="${prestamo.estadoVisual}">
                        </span>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(prestamos)}">
                    <td colspan="6"
                        class="text-center text-secondary py-4">
                        No hay préstamos registrados.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer text-secondary">
            Total de préstamos:
            <span th:text="${#lists.size(prestamos)}">0</span>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
