<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autores — Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/menu :: menu('autores')}"></div>

<main class="container py-4">
    <div class="encabezado">
        <h1>Autores</h1>
        <p class="text-secondary">Escritores registrados en la biblioteca</p>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Apellidos</th>
                    <th scope="col">Nacionalidad</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="autor : ${autores}">
                    <td th:text="${autor.nombre}"></td>
                    <td th:text="${autor.apellidos}"></td>
                    <td th:text="${autor.nacionalidad}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(autores)}">
                    <td colspan="3" class="text-center text-secondary py-4">
                        No hay autores registrados.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer text-secondary">
            Total de autores: <span th:text="${#lists.size(autores)}">0</span>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
