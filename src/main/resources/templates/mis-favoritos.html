<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis favoritos — Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/menu :: menu('misfavoritos')}"></div>

<main class="container py-4">

    <div th:if="${mensaje}"
         class="alert alert-success"
         role="status"
         th:text="${mensaje}">
    </div>

    <div class="encabezado">
        <h1>Mis favoritos</h1>
        <p class="text-secondary">Libros que has marcado con la estrella</p>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th scope="col">Título</th>
                    <th scope="col">Autores</th>
                    <th scope="col">Año</th>
                    <th scope="col">Ejemplares disponibles</th>
                    <th scope="col"></th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="libro : ${libros}">
                    <td class="fw-semibold">
                        <i class="bi bi-star-fill text-warning me-1"></i>
                        <span th:text="${libro.titulo}"></span>
                    </td>

                    <td>
                        <div th:each="autor : ${libro.autores}"
                             th:text="${autor.nombre + ' ' + autor.apellidos}">
                        </div>
                    </td>

                    <td th:text="${libro.anioPublicacion}"></td>

                    <td th:text="${libro.ejemplaresDisponibles}"></td>

                    <td class="text-end">
                        <form th:action="@{/user/favoritos/{id}(id=${libro.id})}" method="post">
                            <input type="hidden" name="origen" value="favoritos">
                            <button type="submit"
                                    class="btn btn-sm btn-outline-secondary"
                                    th:text="#{favorito.boton.quitar}">
                                Quitar de favoritos
                            </button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(libros)}">
                    <td colspan="5"
                        class="text-center text-secondary py-4"
                        th:text="#{favorito.listado.vacio}">
                        Todavía no tienes libros favoritos.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer text-secondary">
            Total de favoritos:
            <span th:text="${#lists.size(libros)}">0</span>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
