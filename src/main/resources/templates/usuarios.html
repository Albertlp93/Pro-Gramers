<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios — Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/menu :: menu('usuarios')}"></div>

<main class="container py-4">
    <div class="encabezado">
        <h1>Usuarios</h1>
        <p class="text-secondary">Socios de la biblioteca</p>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Apellidos</th>
                    <th scope="col">Email</th>
                    <th scope="col">Teléfono</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td class="fw-semibold"
                        th:text="${usuario.nombre}">
                    </td>

                    <td th:text="${usuario.apellidos}"></td>
                    <td th:text="${usuario.email}"></td>
                    <td th:text="${usuario.telefono}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="4"
                        class="text-center text-secondary py-4">
                        No hay usuarios registrados.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer text-secondary">
            Total de usuarios:
            <span th:text="${#lists.size(usuarios)}">0</span>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
