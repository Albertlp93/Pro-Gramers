<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.403.titulo} + ' — ' + #{menu.marca}">Acceso denegado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<!-- Spring Boot muestra esta plantilla automáticamente cuando la respuesta es un 403. -->
<div th:replace="~{fragments/menu :: menu('')}"></div>

<main class="container py-5">
    <div class="card mx-auto text-center" style="max-width: 560px;">
        <div class="card-body p-5">
            <i class="bi bi-shield-lock display-4 text-danger"></i>
            <p class="text-secondary fw-semibold mt-3 mb-1">Error 403</p>
            <h1 class="h3" th:text="#{error.403.titulo}">Acceso denegado</h1>
            <p class="text-secondary mt-3" th:text="#{error.403.mensaje}">No tienes permiso para ver esta página. Si crees que es un error, contacta con el administrador de la biblioteca.</p>
            <a th:href="@{/}" class="btn btn-primary mt-2">
                <i class="bi bi-house-door me-1"></i><span th:text="#{error.volverInicio}">Volver al inicio</span>
            </a>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
