<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${libro.id == null
        ? 'Nuevo libro — Biblioteca'
        : 'Editar libro — Biblioteca'}">
        Libro — Biblioteca
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/menu :: menu('libros')}"></div>

<main class="container py-4">
    <div class="encabezado d-flex justify-content-between align-items-center">
        <h1 th:text="${libro.id == null ? 'Nuevo libro' : 'Editar libro'}">
            Libro
        </h1>

        <a th:href="@{/libros}" class="btn btn-outline-secondary">
            Volver al listado
        </a>
    </div>

    <div class="card p-4">
        <form th:action="${libro.id == null}
                ? @{/libros/guardar}
                : @{/libros/{id}/guardar(id=${libro.id})}"
            th:object="${libro}"
            method="post">

            <div class="mb-3">
                <label for="titulo" class="form-label">Título *</label>
                <input type="text"
                       id="titulo"
                       th:field="*{titulo}"
                       class="form-control"
                       th:errorclass="is-invalid"
                       maxlength="100"
                       required>

                <div class="invalid-feedback"
                     th:errors="*{titulo}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="isbn" class="form-label">ISBN *</label>
                    <input type="text"
                           id="isbn"
                           th:field="*{isbn}"
                           class="form-control"
                           th:errorclass="is-invalid"
                           pattern="[0-9]{13}"
                           maxlength="13"
                           inputmode="numeric"
                           required>

                    <div class="form-text">
                        Introduce 13 dígitos, sin espacios ni guiones.
                    </div>

                    <div class="invalid-feedback"
                         th:errors="*{isbn}"></div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="anioPublicacion" class="form-label">
                        Año de publicación
                    </label>
                    <input type="number"
                           id="anioPublicacion"
                           th:field="*{anioPublicacion}"
                           class="form-control"
                           th:errorclass="is-invalid"
                           min="1">

                    <div class="invalid-feedback"
                         th:errors="*{anioPublicacion}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label for="editorial" class="form-label">Editorial</label>
                <input type="text"
                       id="editorial"
                       th:field="*{editorial}"
                       class="form-control"
                       th:errorclass="is-invalid"
                       maxlength="100">

                <div class="invalid-feedback"
                     th:errors="*{editorial}"></div>
            </div>

            <div class="mb-3">
                <label for="genero" class="form-label">Género</label>
                <input type="text"
                       id="genero"
                       th:field="*{genero}"
                       class="form-control"
                       th:errorclass="is-invalid"
                       maxlength="50">

                <div class="invalid-feedback"
                     th:errors="*{genero}"></div>
            </div>

            <div class="mb-3">
                <label for="autores" class="form-label">Autores *</label>
                <select id="autores"
                        th:field="*{autores}"
                        class="form-select"
                        th:errorclass="is-invalid"
                        multiple
                        size="8"
                        required>

                    <option th:each="autor : ${autores}"
                            th:value="${autor.id}"
                            th:text="${autor.apellidos + ', ' + autor.nombre}">
                    </option>
                </select>

                <div class="form-text">
                    Mantén pulsada Ctrl para seleccionar varios autores.
                </div>

                <div class="invalid-feedback"
                     th:errors="*{autores}"></div>
            </div>

            <div class="mb-4">
                <label for="ejemplaresDisponibles" class="form-label">
                    Ejemplares disponibles *
                </label>
                <input type="number"
                       id="ejemplaresDisponibles"
                       th:field="*{ejemplaresDisponibles}"
                       class="form-control"
                       th:errorclass="is-invalid"
                       min="0"
                       required>

                <div class="invalid-feedback"
                     th:errors="*{ejemplaresDisponibles}"></div>
            </div>

            <p class="text-secondary small">* Campos obligatorios.</p>

            <button type="submit" class="btn btn-primary">
                Guardar
            </button>

            <a th:href="@{/libros}" class="btn btn-outline-secondary">
                Cancelar
            </a>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
